<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kyson图集 | K-Vault 实时画廊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans SC', sans-serif;
    background: #0f1115;
    color: #e8e8e8;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,17,21,0.92); backdrop-filter: blur(10px);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  h1 { font-size: 18px; font-weight: 600; }
  .badge { font-size: 12px; color: #9aa; }
  .badge.live { color: #4caf50; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
    padding: 16px;
  }
  .card {
    border-radius: 10px; overflow: hidden;
    background: #1a1d24;
    cursor: zoom-in;
    position: relative;
    aspect-ratio: 3/4;
  }
  .card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .2s;
  }
  .card:hover img { transform: scale(1.03); }
  .card .time {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 20px 8px 6px;
    font-size: 11px; color: #ddd;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
  }
  #lightbox {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.93);
    align-items: center; justify-content: center;
    flex-direction: column;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 85vh; border-radius: 8px; }
  #lightbox .info { margin-top: 10px; font-size: 13px; color: #aaa; }
  #lightbox .close {
    position: absolute; top: 16px; right: 24px;
    font-size: 30px; cursor: pointer; color: #ccc;
  }
  .empty { text-align: center; padding: 80px 20px; color: #667; }
  .refresh-note { font-size: 12px; color: #556; text-align: center; padding: 8px; }
</style>
</head>
<body>
<header>
  <h1 id="title">📚 我的图集</h1>
  <div>
    <span class="badge" id="count">加载中…</span>
    <span class="badge live" id="live">● 实时</span>
  </div>
</header>
<div class="grid" id="grid"></div>
<div class="refresh-note" id="note">自动刷新中，新图实时出现</div>

<div id="lightbox">
  <span class="close" onclick="closeLightbox()">✕</span>
  <img id="lbImg" src="" alt="">
  <div class="info" id="lbInfo"></div>
</div>

<script>
// ========== 配置区（改这里即可） ==========
const CONFIG = {
  title: '我的图集',   // 相册页标题
  folder: '',          // 留空 = 显示全部图片；填文件夹名（= 上传页里选的文件夹，如 album）则只显示该文件夹
  limit: 500,          // 最多显示多少张（1-500）
  refresh: 60,         // 自动刷新间隔（秒）
};
// URL 参数可覆盖配置：?folder=album&title=画集&refresh=120&limit=200
// =========================================

const params = new URLSearchParams(location.search);
const FOLDER = params.get('folder') != null ? params.get('folder') : CONFIG.folder;
const TITLE = params.get('title') || CONFIG.title;
const LIMIT = Math.min(Math.max(parseInt(params.get('limit') || CONFIG.limit, 10) || CONFIG.limit, 1), 500);
const REFRESH = Math.max(parseInt(params.get('refresh') || CONFIG.refresh, 10) || CONFIG.refresh, 15);

document.getElementById('title').textContent = '📚 ' + TITLE;

const API = '/api/public/gallery?folder=' + encodeURIComponent(FOLDER) + '&limit=' + LIMIT;
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const noteEl = document.getElementById('note');
let lastNames = new Set();

function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function openLightbox(src, name, ts) {
  document.getElementById('lbImg').src = src;
  document.getElementById('lbInfo').textContent = name + ' · ' + fmtTime(ts);
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lbImg').src = '';
}
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox') closeLightbox();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

async function refresh() {
  try {
    const res = await fetch(API, { cache: 'default' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || 'API 错误');

    countEl.textContent = data.total + ' 张';
    if (data.total === 0) {
      grid.innerHTML = '<div class="empty">还没有图片，先去上传页传几张吧</div>';
      lastNames = new Set();
      return;
    }
    grid.querySelector('.empty')?.remove();

    const current = new Set(data.files.map(f => f.name));
    let changed = 0;
    for (const f of data.files) {
      if (lastNames.has(f.name)) continue;
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.name = f.name;
      card.innerHTML = `<img loading="lazy" src="${f.src}" alt=""><div class="time">${fmtTime(f.ts)}</div>`;
      card.onclick = () => openLightbox(f.src, f.name, f.ts);
      grid.appendChild(card);
      lastNames.add(f.name);
      changed++;
    }
    for (const card of grid.querySelectorAll('.card')) {
      if (!current.has(card.dataset.name)) {
        card.remove();
        lastNames.delete(card.dataset.name);
        changed++;
      }
    }
    if (changed > 0) {
      noteEl.textContent = '💾 已更新 · ' + new Date().toLocaleTimeString();
    }
  } catch (e) {
    noteEl.textContent = '连接失败，自动重试中…';
  }
}

refresh();
setInterval(refresh, REFRESH * 1000);
</script>
</body>
</html>
